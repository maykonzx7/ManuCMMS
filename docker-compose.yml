# ManuCMMS — ambiente local (fase 0)
# Uso: docker compose up -d
# Credenciais padrão são apenas para desenvolvimento.

services:
  postgres:
    image: postgres:16-alpine
    container_name: manucmms-postgres
    restart: unless-stopped
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-manucmms}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-manucmms_dev}
      POSTGRES_DB: ${POSTGRES_DB:-manucmms}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB" || exit 1',
        ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  mongo:
    image: mongo:7
    container_name: manucmms-mongo
    restart: unless-stopped
    ports:
      - "${MONGO_PORT:-27017}:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_INITDB_ROOT_USERNAME:-manucmms}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD:-manucmms_dev}
    volumes:
      - mongo_data:/data/db
    healthcheck:
      # Usa variáveis já injetadas no container ($$ vira $ no shell do container)
      test:
        [
          "CMD-SHELL",
          'mongosh "mongodb://$$MONGO_INITDB_ROOT_USERNAME:$$MONGO_INITDB_ROOT_PASSWORD@127.0.0.1:27017/admin" --quiet --eval "db.adminCommand({ ping: 1 })" || exit 1',
        ]
      interval: 5s
      timeout: 10s
      retries: 10
      start_period: 15s

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: manucmms-rabbitmq
    restart: unless-stopped
    ports:
      - "${RABBITMQ_PORT:-5672}:5672"
      - "${RABBITMQ_MANAGEMENT_PORT:-15672}:15672"
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER:-manucmms}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS:-manucmms_dev}
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 30s

  redis:
    image: redis:7-alpine
    container_name: manucmms-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  worker-events:
    build:
      context: .
      dockerfile: services/worker-events/Dockerfile
    container_name: manucmms-worker-events
    restart: unless-stopped
    env_file:
      - ./services/worker-events/.env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-manucmms}:${POSTGRES_PASSWORD:-manucmms_dev}@postgres:5432/${POSTGRES_DB:-manucmms}
      RABBITMQ_URL: amqp://${RABBITMQ_DEFAULT_USER:-manucmms}:${RABBITMQ_DEFAULT_PASS:-manucmms_dev}@rabbitmq:5672/
      PORT: 3005
    ports:
      - "${WORKER_EVENTS_PORT:-3005}:3005"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"fetch('http://127.0.0.1:3005/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\"",
        ]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s

  iot-ingestion:
    build:
      context: .
      dockerfile: services/iot-ingestion/Dockerfile
    container_name: manucmms-iot-ingestion
    restart: unless-stopped
    env_file:
      - ./services/iot-ingestion/.env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-manucmms}:${POSTGRES_PASSWORD:-manucmms_dev}@postgres:5432/${POSTGRES_DB:-manucmms}
      RABBITMQ_URL: amqp://${RABBITMQ_DEFAULT_USER:-manucmms}:${RABBITMQ_DEFAULT_PASS:-manucmms_dev}@rabbitmq:5672/
      REDIS_URL: redis://redis:6379
      PORT: 3002
    ports:
      - "${IOT_INGESTION_PORT:-3002}:3002"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"fetch('http://127.0.0.1:3002/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\"",
        ]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s

volumes:
  postgres_data:
  mongo_data:
  rabbitmq_data:
  redis_data:
