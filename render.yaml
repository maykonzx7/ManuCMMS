# Blueprint Render — ManuCMMS API
# https://render.com/docs/blueprint-spec
#
# Build na raiz do monorepo (Dockerfile na raiz copia backend/).
# Alternativa no painel: Root Directory = backend + Dockerfile em backend/.

services:
  - type: web
    name: manucmms-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      # --- Obrigatórias (preencher no painel Render; não usar localhost) ---
      - key: DATABASE_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_JWT_SECRET
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: MONGODB_URI
        sync: false
      - key: RABBITMQ_URL
        sync: false
      - key: REDIS_URL
        sync: false
      - key: PUBLIC_BASE_URL
        value: https://manucmms.onrender.com
      - key: FRONTEND_PUBLIC_BASE_URL
        value: https://manucmms.vercel.app
      - key: CORS_ALLOWED_ORIGINS
        value: https://manucmms.vercel.app
      - key: CORS_ALLOWED_ORIGIN_SUFFIXES
        value: .vercel.app
      - key: PLATFORM_ALLOW_EMAIL_FALLBACK
        value: "true"
      - key: PLATFORM_OWNER_EMAILS
        value: maykon011games@gmail.com
