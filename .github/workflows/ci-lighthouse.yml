# NF-01 / NF-11 — Lighthouse em CI (Chromium no runner Ubuntu)
name: Lighthouse NF

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - 'scripts/collect-nf-evidence.sh'
      - '.github/workflows/ci-lighthouse.yml'

jobs:
  lighthouse-public-pages:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Instalar Chromium
        run: sudo apt-get update && sudo apt-get install -y chromium-browser

      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build
        env:
          NEXT_PUBLIC_API_BASE_URL: http://localhost:3000
          NEXT_PUBLIC_SUPABASE_URL: https://test-project-ref.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: test-anon-key

      - name: Subir frontend
        working-directory: frontend
        run: |
          npx next start -p 3001 &
          sleep 15
          curl -sf http://localhost:3001/workspace/acesso || exit 1

      - name: Coletar Lighthouse
        env:
          CHROME_PATH: /usr/bin/chromium-browser
          FRONTEND_BASE_URL: http://localhost:3001
          API_BASE_URL: http://localhost:3000
        run: |
          chmod +x scripts/collect-nf-evidence.sh
          ./scripts/collect-nf-evidence.sh || true
          test -f docs/evidencias/NF-01-lighthouse/resumo-scores.json

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nf-01-lighthouse
          path: docs/evidencias/NF-01-lighthouse/
